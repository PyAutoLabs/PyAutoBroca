[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyauto-broca"
version = "0.1.0"
description = "Assistant evaluation and upkeep evidence"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pyauto-broca = "broca.__main__:main"

[tool.setuptools.packages.find]
include = ["broca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
