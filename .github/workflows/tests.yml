name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: PyAutoBroca
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './PyAutoBroca[test]'
      - run: python -m pytest PyAutoBroca/tests -q
      - run: python -m broca --root PyAutoBroca check
